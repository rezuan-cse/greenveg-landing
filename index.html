<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Veg — Fresh Produce Delivered via EV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background-color: #16a34a;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .btn:hover { background-color: #15803d; }
    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🌱 Launching Soon</div>
    <h1>Green Veg</h1>
    <p>Fresh, organic produce delivered straight to your doorstep using eco-friendly Electric Vehicles. Clean energy meets farm-fresh delivery.</p>
    <a href="mailto:support@greenveg.co" class="btn">Get in Touch</a>
    <div class="footer">
      &copy; 2026 Green Veg. All rights reserved.
    </div>
  </div>
</body>
</html>
